<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#faf9f5"/>
    </radialGradient>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2886b"/>
      <stop offset="100%" stop-color="#c15f3e"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#d97757" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="#e6e3da" stroke-width="4"/>

  <!-- Academic Emblem / SkillTracker Compass Mark -->
  <g transform="translate(106, 106)" filter="url(#softGlow)">
    <!-- Outer Geometry -->
    <path d="M150 20 L270 90 L270 210 L150 280 L30 210 L30 90 Z" 
          fill="none" 
          stroke="#d9d5c9" 
          stroke-width="8" 
          stroke-linejoin="round"/>
          
    <!-- Inner Terracotta Diamond & Compass Needle -->
    <path d="M150 45 L245 150 L150 255 L55 150 Z" 
          fill="url(#terracottaGrad)" 
          stroke="#ffffff" 
          stroke-width="3" 
          stroke-linejoin="round"/>
          
    <!-- Core Academic Pivot Point -->
    <circle cx="150" cy="150" r="28" fill="#1a1918" stroke="#ffffff" stroke-width="6"/>
    <circle cx="150" cy="150" r="10" fill="#ffffff"/>
    
    <!-- Pulse Spark Accent -->
    <path d="M150 75 L155 125 L150 135 L145 125 Z" fill="#ffffff"/>
    <path d="M150 225 L155 175 L150 165 L145 175 Z" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>
