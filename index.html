<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    
    <!-- App & Mobile Meta Tags -->
    <meta name="theme-color" content="#faf9f5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SkillTracker" />
    <meta name="description" content="SkillTracker Student Portal — Diagnostics, Continuous Lab Assessments, and DSA Preparation for ADTU" />
    
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>SkillTracker — Student Portal</title>

    <!-- Professional Typography: Plus Jakarta Sans & Newsreader & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#faf9f5] text-[#1f1e1d] font-sans antialiased selection:bg-[#d97757]/20 selection:text-[#1f1e1d] min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <!-- SkillTracker: apply saved theme before React hydrates to prevent flash -->
    <script>
      try {
        var t = localStorage.getItem('skilltracker_theme') || 'terracotta';
        document.documentElement.dataset.theme = t;
      } catch(e) {}
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
